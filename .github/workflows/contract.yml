name: contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The skill does not need a newer server than ks-test or ks-production runs
        run: |
          skill=$(grep -oE 'this skill is version [0-9]+' plugins/arcsite-ks-update/skills/ks-update/SKILL.md | grep -oE '[0-9]+$')
          if [ -z "$skill" ]; then
            echo "SKILL.md does not name its contract version"; exit 1
          fi
          for target in "ks-test https://admin-test.arcsite.com" "ks-production https://admin.arcsite.com"; do
            set -- $target
            if ! answer=$(curl -fsS "$2/manage/ks-mcp/contract"); then
              echo "$1 does not serve its contract: deploy the server with the connection open first, then re-run this check."
              exit 1
            fi
            server=$(printf '%s' "$answer" | python3 -c 'import json,sys; print(json.load(sys.stdin)["contract_version"])')
            echo "skill $skill, $1 $server"
            if [ "$skill" -gt "$server" ]; then
              echo "The skill is written for contract $skill but $1 runs $server: deploy the server first, then re-run this check."
              exit 1
            fi
          done
      - name: Plugin manifests validate
        run: |
          if npm install -g @anthropic-ai/claude-code >/dev/null 2>&1; then
            claude plugin validate --strict .
            claude plugin validate --strict plugins/arcsite-ks-update
          else
            echo "Claude Code could not be installed here; skipping validation"
          fi
